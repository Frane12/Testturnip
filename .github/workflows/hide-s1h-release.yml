name: Hide S1H release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-s1h-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - name: Convert S1H to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release edit "drnas-turnip-s1h-a810"             --repo "$GITHUB_REPOSITORY"             --draft
