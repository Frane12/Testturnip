name: Promote S1 to Latest Release

on:
  push:
    paths:
      - '.github/workflows/promote-s1-release.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Drnas-Turnip S1 A810 as stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release edit "drnas-turnip-s1-a810" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
