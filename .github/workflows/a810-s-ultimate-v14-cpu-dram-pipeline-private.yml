name: A810 S Ultimate v1.4 CPU DRAM PIPE PRIVATE DRAFT
on:
  push:
    branches:
      - 'experiment/a810-sultimate-v14-cpu-dram-pipeline-draft'
    paths:
      - 'patches/at4-s1guard-full.patch'
      - '.github/workflows/a810-s-ultimate-v12-s1bp-private.yml'
      - 'patches/a810_sultimate_v11_overlay.py'
      - 'patches/a810_sultimate_v12_s1bp_overlay.py'
      - 'patches/frane_a810_s1_bandwidth_probe.h'
      - 'tests/a810_s1bp_v12_host.cpp'
      - 'tests/a810_s1bp_v12_source.py'
      - 'A810_S_ULTIMATE_V12_S1BP.md'
      - 'A810_S_ULTIMATE_V13_S1AT4.md'
      - 'A810_S_ULTIMATE_V14_CPU_DRAM_PIPELINE.md'
      - 'patches/frane_a810_cpu_pipeline_probe.h'
      - 'patches/a810_sultimate_v14_cpu_pipeline_overlay.py'
      - 'tests/a810_cpu_pipe_v14_host.cpp'
      - 'tests/a810_cpu_pipe_v14_source.py'
      - '.github/workflows/a810-s-ultimate-v14-cpu-dram-pipeline-private.yml'
      - 'patches/frane_a810_s1at4_coord.h'
      - 'patches/a810_sultimate_v13_s1at4_overlay.py'
      - 'tests/a810_s1at4_v13_host.cpp'
      - 'tests/a810_s1at4_v13_source.py'
      - '.github/workflows/a810-s-ultimate-v13-s1at4-private.yml'
      - 'tests/a810_sultimate_v11_host.cpp'
      - 'tests/a810_sultimate_v11_source.py'
      - 'patches/a810_cp1_queue.py'
      - 'patches/frane_a810_cp1.h'
      - 'patches/a810_at7_overlay.py'
      - 'patches/frane_a810_at7_utility.h'
      - 'patches/frane_a810_at63_earlywinner.h'
      - 'patches/frane_a810_at6_at4base.h'
      - 'patches/a810_at6.py'
      - 'patches/frane_a810_at6.h'
      - 'patches/a810_at5.py'
      - 'patches/frane_a810_at5.h'
      - 'patches/a810_at4_rfc1.py'
      - 'patches/frane_a810_at4_rfc1.h'
      - 'tests/**'
      - 'AT4-DRAFT.md'
      - 'A810_AT4_RFC1_TRACE.md'
      - 'A810_AT5_CONTEXT_LEARNER.md'
      - 'A810_AT7_UTILITY.md'
      - 'A810_CP1_QUEUE.md'
      - 'patches/a810_at8_overlay.py'
      - 'patches/frane_a810_at8_early.h'
      - 'tests/a810_at8_source.py'
      - 'tests/a810_at8_host.cpp'
      - 'A810_AT8_EARLY_GPU.md'
      - 'patches/a810_atultimate_overlay.py'
      - 'patches/frane_a810_atultimate.h'
      - 'patches/frane_a810_atultimate_trace.h'
      - 'tests/a810_atultimate_source.py'
      - 'tests/a810_atultimate_host.cpp'
      - 'A810_ATULTIMATE_CONTEXT.md'
      - 'patches/a810_atultimate_dynamic_overlay.py'
      - 'patches/frane_a810_atultimate_dynamic.h'
      - 'tests/a810_atultimate_dynamic_source.py'
      - 'tests/a810_atultimate_dynamic_host.cpp'
      - 'A810_ATULTIMATE_DYNAMIC_V2.md'
      - 'patches/frane_a810_atultimate_v3.h'
      - 'patches/a810_atultimate_v3_overlay.py'
      - 'tests/a810_atultimate_v3_host.cpp'
      - 'tests/a810_atultimate_v3_source.py'
      - 'A810_ATULTIMATE_DYNAMIC_V3.md'
      - 'patches/a810_sultimate_rc_branding.py'
      - 'tests/a810_sultimate_rc_source.py'
      - 'A810_S_ULTIMATE_V1_RC.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y git ninja-build pkg-config python3-pip python3-mako python3-yaml python3-ply python3-packaging bison flex glslang-tools spirv-tools libdrm-dev libelf-dev libexpat1-dev libzstd-dev zip
          python3 -m pip install --break-system-packages 'meson>=1.4' mako pyyaml packaging ply
      - name: Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Fetch pinned Mesa and apply A810 S Ultimate v1.0 RC1
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/chaotic-cx/mesa-mirror.git mesa
          git -C mesa fetch --depth 1 origin eda9aceb39d5ff169b096444abe366bdf2269e24
          git -C mesa checkout --detach eda9aceb39d5ff169b096444abe366bdf2269e24
          test "$(cat mesa/VERSION)" = "26.3.0-devel"
          git -C mesa apply --check ../patches/at4-s1guard-full.patch
          git -C mesa apply ../patches/at4-s1guard-full.patch
          python3 patches/a810_at4_rfc1.py
          python3 patches/a810_at7_overlay.py
          python3 patches/a810_cp1_queue.py
          python3 patches/a810_at8_overlay.py
          python3 patches/a810_atultimate_overlay.py
          python3 patches/a810_atultimate_dynamic_overlay.py
          python3 patches/a810_atultimate_v3_overlay.py
          python3 patches/a810_sultimate_rc_branding.py
          git -C mesa diff --check
          git -C mesa diff > A810-S-Ultimate-v1.4-CPU-PIPE-complete.patch
          sha256sum patches/at4-s1guard-full.patch patches/frane_a810_at4_rfc1.h patches/a810_at4_rfc1.py patches/frane_a810_at6_at4base.h patches/frane_a810_at63_earlywinner.h patches/frane_a810_at7_utility.h patches/a810_at7_overlay.py patches/frane_a810_cp1.h patches/a810_cp1_queue.py patches/frane_a810_at8_early.h patches/a810_at8_overlay.py patches/frane_a810_atultimate.h patches/frane_a810_atultimate_trace.h patches/a810_atultimate_overlay.py patches/frane_a810_atultimate_dynamic.h patches/a810_atultimate_dynamic_overlay.py patches/frane_a810_atultimate_v3.h patches/a810_atultimate_v3_overlay.py patches/a810_sultimate_rc_branding.py
      - name: Audit selector, category hysteresis and Vulkan HUD with UBSan
        run: |
          python3 tests/test_at4_runtime.py mesa
          python3 tests/test_at4_history.py mesa
          python3 tests/a810_at4_rfc1_source.py mesa
          python3 tests/a810_at7_source.py mesa
          python3 tests/a810_cp1_source.py mesa
          python3 tests/a810_at8_source.py mesa
          python3 tests/a810_atultimate_source.py mesa
          python3 tests/a810_atultimate_dynamic_source.py mesa
          python3 tests/a810_atultimate_v3_source.py mesa
          python3 tests/a810_sultimate_rc_source.py mesa
          python3 patches/a810_sultimate_v11_overlay.py
          python3 tests/a810_sultimate_v11_source.py mesa
          python3 patches/a810_sultimate_v12_s1bp_overlay.py
          python3 tests/a810_s1bp_v12_source.py mesa
          python3 patches/a810_sultimate_v13_s1at4_overlay.py
          python3 tests/a810_s1at4_v13_source.py mesa
          python3 patches/a810_sultimate_v14_cpu_pipeline_overlay.py
          python3 tests/a810_cpu_pipe_v14_source.py mesa
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -pthread -Ipatches tests/a810_cpu_pipe_v14_host.cpp -o /tmp/a810-cpu-pipe-v14-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-cpu-pipe-v14-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Ipatches tests/a810_s1at4_v13_host.cpp -o /tmp/a810-s1at4-v13-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-s1at4-v13-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -pthread -Ipatches tests/a810_s1bp_v12_host.cpp -o /tmp/a810-s1bp-v12-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-s1bp-v12-host
          git -C mesa diff --check
          git -C mesa diff > A810-S-Ultimate-v1.4-CPU-PIPE-complete.patch
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_sultimate_v11_host.cpp -o /tmp/a810-v11-host
          /tmp/a810-v11-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_atultimate_v3_host.cpp -o /tmp/a810-atu-v3-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-atu-v3-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_atultimate_dynamic_host.cpp -o /tmp/a810-atu-v2-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-atu-v2-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_atultimate_host.cpp -o /tmp/a810-atu-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-atu-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_at8_host.cpp -o /tmp/a810-at8-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-at8-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=undefined -Ipatches tests/a810_cp1_host.cpp -o /tmp/a810-cp1-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-cp1-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -Imesa/src/freedreno/vulkan tests/a810_at7_host.cpp -o /tmp/a810-at7-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-at7-host
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -fsanitize=undefined -Ipatches tests/a810_at4_rfc1_host.cpp -o /tmp/a810-rfc1-host
          UBSAN_OPTIONS=halt_on_error=1 /tmp/a810-rfc1-host
      - name: Configure Android aarch64 KGSL
        run: |
          set -euo pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          grep -E "Pkg.Revision" "$NDK/source.properties"
          grep -qE "Pkg.Revision = 29\\." "$NDK/source.properties"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          test -d "$NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android34-clang"
          mkdir -p /tmp/empty-android-pkgconfig
          cat > android-aarch64.ini <<EOF
          [binaries]
          ar = '$BIN/llvm-ar'
          c = '$BIN/aarch64-linux-android34-clang'
          cpp = ['$BIN/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/tmp/empty-android-pkgconfig', '/usr/bin/pkg-config']
          [built-in options]
          cpp_link_args = ['-static-libstdc++']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          meson setup mesa/build-android mesa --cross-file android-aarch64.ini -Dbuildtype=release -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dplatform-sdk-version=36 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Degl=disabled -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dvulkan-beta=true
      - name: Compile Turnip
        run: ninja -C mesa/build-android -j 8
      - name: Package installable draft ZIP
        run: |
          set -euo pipefail
          mkdir -p out
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so out/
          test -s out/libvulkan_freedreno.so
          file out/libvulkan_freedreno.so
          test "$(file out/libvulkan_freedreno.so | grep -c 'ARM aarch64')" -gt 0
          "$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -name llvm-strip | head -1)" --strip-unneeded out/libvulkan_freedreno.so
          cat > out/meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "Drnas-Turnip A810 S Ultimate v1.4 (PRIVATE DRAFT)",
            "description": "A810 S Ultimate v1.4 opt-in CPU command recording and queue timing, process RSS; S1BP estimates, v1.3 render logic retained",
            "author": "Frane12",
            "packageVersion": "1.3-s1at4-draft",
            "vendor": "Mesa",
            "driverVersion": "26.3.0-devel",
            "minApi": 34,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --dyn-syms out/libvulkan_freedreno.so > elf-symbols.txt
          grep -Eq 'GLOBAL +DEFAULT +[0-9]+ +HMI$' elf-symbols.txt
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d out/libvulkan_freedreno.so > elf-dynamic.txt
          ! grep -q 'libc++_shared.so' elf-dynamic.txt
          python3 -c 'import json; m=json.load(open("out/meta.json")); assert m["libraryName"]=="libvulkan_freedreno.so" and m["minApi"]==34'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_A810_RFC1_TRACE_PATH'
          strings out/libvulkan_freedreno.so | grep -q 'Drnas-Turnip A810 S Ultimate v1.4'
          strings out/libvulkan_freedreno.so | grep -q 'SAFETY_VETO'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_S1BP_TRACE_PATH'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_S1AT4_COORD'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_CPU_CB_TRACE_PATH'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_CPU_QUEUE_TRACE_PATH'
          strings out/libvulkan_freedreno.so | grep -q 'S1_AT4_COORD'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_AT7'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_AT63'
          ! strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_AT5'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_CONTEXT_TRACE_PATH'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_DYNAMIC'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_V3'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ULTIMATE_HUD_BRAND'
          strings out/libvulkan_freedreno.so | grep -q 'ATU_V3_CATEGORY_WINNER'
          strings out/libvulkan_freedreno.so | grep -q 'NO_PAIRED'
          strings out/libvulkan_freedreno.so | grep -q 'WAIT_DWELL'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_FAST'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_DWELL'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_ATU_PHASE_HITS'
          strings out/libvulkan_freedreno.so | grep -q 'ATU_DYNAMIC_WINNER'
          strings out/libvulkan_freedreno.so | grep -q 'PRIOR_CONFLICT_BLOCKED'
          ! strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_AT9'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_AT8'
          strings out/libvulkan_freedreno.so | grep -q 'AT8_EARLY_GPU_WINNER'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_CP1_ZERO_SKIP'
          strings out/libvulkan_freedreno.so | grep -q 'TU_FRANE_A810_CP1_TRACE_PATH'
          cd out
          zip -9 ../Drnas-Turnip-A810-S-Ultimate-v1.4-CPU-PIPE-DRAFT.zip libvulkan_freedreno.so meta.json
          cd ..
          sha256sum out/libvulkan_freedreno.so Drnas-Turnip-A810-S-Ultimate-v1.4-CPU-PIPE-DRAFT.zip > SHA256SUMS.txt
      - name: Package reviewable source
        run: |
          zip -9 -r A810-S-Ultimate-v1.4-CPU-PIPE-Source.zip patches/frane_a810_cpu_pipeline_probe.h patches/a810_sultimate_v14_cpu_pipeline_overlay.py tests/a810_cpu_pipe_v14_host.cpp tests/a810_cpu_pipe_v14_source.py A810_S_ULTIMATE_V14_CPU_DRAM_PIPELINE.md patches/frane_a810_s1at4_coord.h patches/a810_sultimate_v13_s1at4_overlay.py tests/a810_s1at4_v13_host.cpp tests/a810_s1at4_v13_source.py A810_S_ULTIMATE_V13_S1AT4.md patches/a810_sultimate_v12_s1bp_overlay.py patches/frane_a810_s1_bandwidth_probe.h tests/a810_s1bp_v12_host.cpp tests/a810_s1bp_v12_source.py A810_S_ULTIMATE_V12_S1BP.md patches/a810_sultimate_v11_overlay.py tests/a810_sultimate_v11_host.cpp tests/a810_sultimate_v11_source.py A810_S_ULTIMATE_V11_DRAFT.md patches/at4-s1guard-full.patch patches/a810_at4_rfc1.py patches/frane_a810_at4_rfc1.h patches/a810_at7_overlay.py patches/frane_a810_at6_at4base.h patches/frane_a810_at63_earlywinner.h patches/frane_a810_at7_utility.h patches/frane_a810_cp1.h patches/a810_cp1_queue.py patches/frane_a810_at8_early.h patches/a810_at8_overlay.py patches/frane_a810_atultimate.h patches/frane_a810_atultimate_trace.h patches/a810_atultimate_overlay.py patches/frane_a810_atultimate_dynamic.h patches/a810_atultimate_dynamic_overlay.py patches/frane_a810_atultimate_v3.h patches/a810_atultimate_v3_overlay.py patches/a810_sultimate_rc_branding.py tests/test_at4_runtime.py tests/test_at4_history.py tests/at3_selector_baseline.cpp.in tests/at4_selector_wrapper.cpp.in tests/a810_at4_rfc1_source.py tests/a810_at7_source.py tests/a810_at7_host.cpp tests/a810_cp1_host.cpp tests/a810_cp1_source.py tests/a810_at8_host.cpp tests/a810_at8_source.py tests/a810_atultimate_host.cpp tests/a810_atultimate_source.py tests/a810_atultimate_dynamic_host.cpp tests/a810_atultimate_dynamic_source.py tests/a810_atultimate_v3_host.cpp tests/a810_atultimate_v3_source.py tests/a810_sultimate_rc_source.py AT4-DRAFT.md A810_AT4_RFC1_TRACE.md A810_AT7_UTILITY.md A810_CP1_QUEUE.md A810_AT8_EARLY_GPU.md A810_ATULTIMATE_CONTEXT.md A810_ATULTIMATE_DYNAMIC_V2.md A810_ATULTIMATE_DYNAMIC_V3.md A810_S_ULTIMATE_V1_RC.md A810-S-Ultimate-v1.4-CPU-PIPE-complete.patch .github/workflows/a810-s-ultimate-v12-s1bp-private.yml .github/workflows/a810-s-ultimate-v13-s1at4-private.yml .github/workflows/a810-s-ultimate-v14-cpu-dram-pipeline-private.yml
          sha256sum A810-S-Ultimate-v1.4-CPU-PIPE-Source.zip >> SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: A810-S-Ultimate-v1.4-CPU-PIPE-PRIVATE-DRAFT
          path: |
            Drnas-Turnip-A810-S-Ultimate-v1.4-CPU-PIPE-DRAFT.zip
            SHA256SUMS.txt
            A810-S-Ultimate-v1.4-CPU-PIPE-Source.zip
            elf-symbols.txt
            elf-dynamic.txt
            A810_AT4_RFC1_TRACE.md
            A810_AT5_CONTEXT_LEARNER.md
            A810_AT7_UTILITY.md
            A810_CP1_QUEUE.md
            A810_AT8_EARLY_GPU.md
            A810_ATULTIMATE_CONTEXT.md
            A810_ATULTIMATE_DYNAMIC_V2.md
            A810_ATULTIMATE_DYNAMIC_V3.md
            A810_S_ULTIMATE_V1_RC.md
            A810_S_ULTIMATE_V12_S1BP.md
            A810_S_ULTIMATE_V13_S1AT4.md
            A810_S_ULTIMATE_V14_CPU_DRAM_PIPELINE.md
          if-no-files-found: error
