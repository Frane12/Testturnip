name: Zvjezdana Macka 0.4 APK
on:
  push:
    branches:
      - zvjezdana-apk-0_4
    paths:
      - '.github/workflows/zvjezdana-apk.yml'
      - 'zvjezdana-ci/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reconstruct and verify 0.4 source package
        run: |
          cat zvjezdana-ci/payload-*.b64 | base64 -d > /tmp/zvjezdana-src.zip
          echo '8af5f199fad72c54531d67f20790772c4b04fe108e3ee8c534925090e182635e  /tmp/zvjezdana-src.zip' | sha256sum -c -
          unzip -q /tmp/zvjezdana-src.zip
      - name: Build and verify signed APK
        run: |
          cd cat-game
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bash build.sh
      - name: Publish Android installer
        uses: actions/upload-artifact@v4
        with:
          name: Zvjezdana-Macka-0.4-APK
          path: cat-game/build/Zvjezdana-Macka-0.4.apk
          if-no-files-found: error
