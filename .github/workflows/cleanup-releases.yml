name: Curate milestone releases

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/cleanup-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Keep and curate milestone releases
        uses: actions/github-script@v7
        with:
          script: |
            const milestones = {
              'a810-v38-gmem-search': {
                name: 'Turnip A810 V38 — GMEM Search',
                prerelease: false,
                body: `## Current A810 baseline

V38 is the recommended starting point for current A810 testing and future development.

### Key changes
- Bounded branch-and-bound GMEM layout search
- V37 layout retained as the permanent fallback
- Alternative layout accepted only on a strict exact \`gmem_pixels\` win
- Search limited to small/tractable render-pass cases to control overhead

### A/B fallback
\`TU_A810_26338_GMEM_SEARCH=0\` restores exact V37 behavior.

**Development branch:** [a810-v38-base](https://github.com/Frane12/Testturnip/tree/a810-v38-base)

Community testing: compare FPS, frametime, artifacts, RAM behavior and GPU efficiency.`
              },
              'a810-v37-gmem-mask-lab': {
                name: 'Turnip A810 V37 — GMEM Mask Lab',
                prerelease: true,
                body: `## A810 GMEM architecture milestone

V37 introduced the GMEM model used as the foundation for V38.

- Exact per-subpass occupancy masks
- Lifetime-aware attachment reuse
- CPP-descending packing
- Exact max-min block packing
- Rescue path for selected baseline-impossible GMEM layouts

A/B fallback: \`TU_A810_26337_GMEM_MASK_PACK=0\``
              },
              'a810-v35-shortname': {
                name: 'Turnip A810 V35 — Validated Baseline',
                prerelease: true,
                body: `## Validated pre-GMEM-search baseline

Preserved as an important comparison point before the V37/V38 GMEM work.

Useful for regression checks when isolating newer GMEM allocation behavior.`
              },
              'frane-mesa-26.3.20-a830-port-boost': {
                name: 'Turnip A830 — Port Boost Milestone',
                prerelease: true,
                body: `## A830 development milestone

Preserved as the key A830 port/performance development release in this repository.

This release is kept for A830 testing and historical comparison while the current main development focus is the A810 V38 line.`
              },
              'v29-fast-noai-mesa-main': {
                name: 'Turnip A810 V29 — FAST-NOAI Mesa Main',
                prerelease: true,
                body: `## Legacy A810 performance milestone

Preserved because V29 FAST-NOAI was an important performance/stability step and a useful historical comparison point.

Superseded for current A810 development by V35 → V37 → V38.`
              },
              'v25-a810-power-perf': {
                name: 'Turnip A810 V25 — Power/Performance Milestone',
                prerelease: true,
                body: `## Early A810 milestone

Preserved as an early power/performance reference from the A810 development path.

For current testing use V38 unless specifically bisecting older behavior.`
              }
            };

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            for (const release of releases) {
              const meta = milestones[release.tag_name];

              if (!meta) {
                core.info(`DELETE RELEASE: ${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                continue;
              }

              core.info(`CURATE: ${release.tag_name}`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: meta.name,
                body: meta.body,
                prerelease: meta.prerelease,
                draft: false
              });
            }

            core.info('Milestone release curation complete. Git tags remain preserved.');
