name: Publish S1H one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-s1h-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download S1H build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir artifact
          gh run download 37158717771             --repo "$GITHUB_REPOSITORY"             --name "Drnas-Turnip-S1-A810"             --dir artifact
          test -f artifact/Drnas-Turnip-S1H-A810.zip
          test -f artifact/SHA256SUMS.txt

      - name: Publish S1H prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="drnas-turnip-s1h-a810"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create "$TAG"             artifact/Drnas-Turnip-S1H-A810.zip             artifact/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target 7a9e8a3be14a607eca0ea1ca3bf66576dc77dadb             --title "Drnas-Turnip S1H A810"             --notes "Experimental S1-based A810 histogram / frametime stabilizer lab. S1 stable release remains unchanged. TU_FRANE_HIST=1 enables user histogram logging; TU_FRANE_HIST_SMOOTH=1 enables optional histogram-based pathway smoothing."             --prerelease
