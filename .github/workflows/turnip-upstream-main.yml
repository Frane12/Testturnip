name: Frane Turnip Mesa 26.2.3 A810 V19 Adaptive Autotune

on:
  push:
    branches: ['mesa-26.2.3-a810-v19-adaptive-autotune']
    paths:
      - '.github/workflows/turnip-upstream-main.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Frane patch stack
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build pkg-config python3-pip python3-mako python3-yaml python3-ply python3-packaging bison flex glslang-tools spirv-tools libdrm-dev libelf-dev libexpat1-dev libzstd-dev zip
          python3 -m pip install --break-system-packages 'meson>=1.4' mako pyyaml packaging ply
      - name: Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Fetch pinned Mesa stable 26.2.3 pinned release
        run: |
          set -eu
          SOURCE_31e9a6b2e95e30d84bf3177d1f497d063e59b6b2=31e9a6b2e95e30d84bf3177d1f497d063e59b6b2
          git clone --depth 1 --filter=blob:none https://github.com/chaotic-cx/mesa-mirror.git mesa
          git -C mesa fetch --depth 1 origin "$SOURCE_31e9a6b2e95e30d84bf3177d1f497d063e59b6b2"
          git -C mesa checkout --detach "$SOURCE_31e9a6b2e95e30d84bf3177d1f497d063e59b6b2"
          test "$(git -C mesa rev-parse HEAD)" = "$SOURCE_31e9a6b2e95e30d84bf3177d1f497d063e59b6b2"
          git -C mesa rev-parse HEAD | tee mesa-commit.txt
          test "$(cat mesa/VERSION)" = "26.2.3"
          git rev-parse HEAD | tee frane-commit.txt
          cat mesa/VERSION
      - name: Port A810 V19 adaptive autotune over V18 and DiskDVD on Mesa 26.2.3
        run: |
          set -eu
          python3 patches/port_mesa_2623.py a810
          git -C mesa diff --check
          test "$(cat mesa/VERSION)" = "26.2.3"
          git -C mesa diff > mesa-applied.patch
          test -s mesa-applied.patch
          grep -q 'Frane A810 V19-ADAPTIVE-AUTOTUNE' mesa/src/freedreno/vulkan/tu_device.cc
          grep -q 'frane_a830_gmem_pressure_tier' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q IR3_DBG_NODESCPREFETCH mesa/src/freedreno/ir3/ir3_compiler.c
          grep -q 'TU_A810_SAMPLED_DEPTH_DIAG' mesa/src/freedreno/vulkan/tu_image.cc
          grep -q 'algorithm::ADAPTIVE' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'TU_A810_ADAPTIVE_LOG' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'kgsl_syncobj_ts_to_fd(&ret)' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          python3 -m py_compile patches/port_upstream_main.py patches/port_mesa_2623.py patches/v19_a810_adaptive_autotune.py
      - name: Prepare Android ARM64 cross file
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.ini <<EOF
          [binaries]
          ar = '$BIN/llvm-ar'
          c = '$BIN/aarch64-linux-android34-clang'
          cpp = ['$BIN/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']
          [built-in options]
          cpp_link_args = ['-static-libstdc++']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
      - name: Configure pinned Mesa 26.2.3 Android Turnip
        run: |
          meson setup mesa/build-android mesa --cross-file android-aarch64.ini -Dbuildtype=release -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dplatform-sdk-version=36 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Degl=disabled -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dvulkan-beta=true
      - name: Compile real Android ARM64 Vulkan driver
        run: meson compile -C mesa/build-android -j 4
      - name: Package Winlator AdrenoTools Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip and provenance
        run: |
          set -eu
          mkdir -p output
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/
          python3 - <<'PY'
          import json, pathlib
          version=pathlib.Path('mesa/VERSION').read_text().strip()
          data = {
            'schemaVersion': 1, 'name': 'Frane Turnip A810 V19 ADAPTIVE AUTOTUNE',
            'driverVersion': f'Mesa {version}', 'description': 'Pinned Mesa 26.2.3; V18 sampled-depth base + V19 session-local adaptive profiled autotuner. Use TU_AUTOTUNE_ALGO=adaptive; experimental',
            'author': 'Frane12; Mesa/Freedreno contributors', 'packageVersion': '1',
            'vendor': 'Mesa', 'minApi': 34, 'libraryName': 'libvulkan_freedreno.so',
            'sourceCommit': pathlib.Path('frane-commit.txt').read_text().strip()
          }
          pathlib.Path('output/meta.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          (cd output && zip -9 ../Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip libvulkan_freedreno.so meta.json)
          sha256sum output/libvulkan_freedreno.so > driver-sha256.txt
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip') as z:
              assert set(z.namelist()) == {'libvulkan_freedreno.so','meta.json'}
              assert z.testzip() is None
              assert z.read('libvulkan_freedreno.so')[:4] == b'\x7fELF'
              assert len(z.read('libvulkan_freedreno.so'))>1000000
              assert json.loads(z.read('meta.json'))['schemaVersion']==1
          print('Driver Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip verified')
          PY
      - name: Upload compiled Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip and full source diff
        uses: actions/upload-artifact@v4
        with:
          name: Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE
          path: |
            Frane-Turnip-Mesa-2623-A810-V19-ADAPTIVE-AUTOTUNE.zip
            mesa-commit.txt
            frane-commit.txt
            mesa-applied.patch
            driver-sha256.txt
