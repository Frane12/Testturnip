      - name: Prepare Android ARM64 cross file
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.ini <<EOF
          [binaries]
          ar = '$BIN/llvm-ar'
          c = '$BIN/aarch64-linux-android34-clang'
          cpp = ['$BIN/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']
          [built-in options]
          cpp_link_args = ['-static-libstdc++']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
      - name: Configure pinned Mesa main Android Turnip
        # Mesa main explicitly rejects Meson b_lto; keep this A/B test source-only.
        run: |
          meson setup mesa/build-android mesa --cross-file android-aarch64.ini -Dbuildtype=release -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dplatform-sdk-version=36 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Degl=disabled -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dvulkan-beta=true
      - name: Compile real Android ARM64 Vulkan driver
        run: meson compile -C mesa/build-android -j 4
      - name: Package Winlator AdrenoTools Drnas-Turnip-V49.zip and provenance
        run: |
          set -eu
          mkdir -p output
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/
          python3 - <<'PY'
          import json, pathlib
          version=pathlib.Path('mesa/VERSION').read_text().strip()
          data = {
            'schemaVersion': 1, 'name': 'Drnas Turnip V49',
            'driverVersion': 'Drnas Turnip V49', 'description': 'A810 GMEM-STICKY: V47 baseline plus de-duplicated strong-GMEM exploration and a narrow 1/256 ultra-sticky measured control probe',
            'author': 'Frane12; Mesa/Freedreno contributors', 'packageVersion': '26.3.49-a810-gmem-frontier',
            'vendor': 'Mesa', 'minApi': 34, 'libraryName': 'libvulkan_freedreno.so',
            'sourceCommit': pathlib.Path('frane-commit.txt').read_text().strip(),
            'upstreamCommit': pathlib.Path('mesa-commit.txt').read_text().strip()
          }
          pathlib.Path('output/meta.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          (cd output && zip -9 ../Drnas-Turnip-V49.zip libvulkan_freedreno.so meta.json)
          sha256sum output/libvulkan_freedreno.so > driver-sha256.txt
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('Drnas-Turnip-V49.zip') as z:
              assert set(z.namelist()) == {'libvulkan_freedreno.so','meta.json'}
              assert z.testzip() is None
              assert z.read('libvulkan_freedreno.so')[:4] == b'\x7fELF'
              so = z.read('libvulkan_freedreno.so')
              assert len(so)>1000000
              assert so[4:6] == bytes([2, 1]), 'Expected ELF64 little-endian'
              assert int.from_bytes(so[16:18], 'little') == 3, 'Expected shared library'
              assert int.from_bytes(so[18:20], 'little') == 183, 'Expected AArch64'
              assert json.loads(z.read('meta.json'))['schemaVersion']==1
          print('Driver Drnas-Turnip-V49.zip verified')
          PY
      - name: Record package checksums
        run: |
          sha256sum Drnas-Turnip-V49.zip mesa-applied.patch > SHA256SUMS.txt
      - name: Publish direct-download GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="a810-v49-gmem-frontier"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" \
            Drnas-Turnip-V49.zip \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Drnas Turnip V49 GMEM-STICKY" \
            --prerelease \
            --notes-file EXPERIMENT_MESA_26_3_49_A810_GMEM_FRONTIER.md
      - name: Upload compiled Drnas-Turnip-V49.zip and full source diff
