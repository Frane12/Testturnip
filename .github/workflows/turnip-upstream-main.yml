name: Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP

on:
  push:
    branches: ['frane-mesa-26.3.5-a810-shader-pipeline-exp']
    paths:
      - '.github/workflows/turnip-upstream-main.yml'
      - 'patches/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frane-mesa-26-3-5-a810-shader-pipeline-exp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Frane patch stack
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build pkg-config python3-pip python3-mako python3-yaml python3-ply python3-packaging bison flex glslang-tools spirv-tools libdrm-dev libelf-dev libexpat1-dev libzstd-dev zip
          python3 -m pip install --break-system-packages 'meson>=1.4' mako pyyaml packaging ply
      - name: Validate experimental timing policy on host
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/profiled_sampling.cpp -o /tmp/profiled-policy-test
          /tmp/profiled-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/present_policy.cpp -o /tmp/present-policy-test
          /tmp/present-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v24_hotpath_equivalence.cpp -o /tmp/v24-hotpath-test
          /tmp/v24-hotpath-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v25_power_policy.cpp -o /tmp/v25-power-test
          /tmp/v25-power-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v29_fast_policy.cpp -o /tmp/v29-fast-policy-test
          /tmp/v29-fast-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2631_sync_policy.cpp -o /tmp/mesa-2631-sync-test
          /tmp/mesa-2631-sync-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2632_a810_turbo.cpp -o /tmp/mesa-2632-turbo-test
          /tmp/mesa-2632-turbo-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2633_a810_profile_turbo.cpp -o /tmp/mesa-2633-profile-turbo-test
          /tmp/mesa-2633-profile-turbo-test

          echo "26.3.4 deterministic ASan+UBSan"
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2634_a810_gmem_runtime.cpp -o /tmp/mesa-2634-gmem-test-asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-test-asan

          echo "26.3.4 deterministic O3+UBSan"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2634_a810_gmem_runtime.cpp -o /tmp/mesa-2634-gmem-test-o3
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-test-o3

          echo "26.3.4 randomized stress ASan+UBSan"
          g++ -std=c++17 -O2 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2634_a810_gmem_runtime_stress.cpp -o /tmp/mesa-2634-gmem-stress
          for seed in 1 17 65537 3735928559 305419896; do
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-stress "$seed" 250000
          done

          echo "26.3.4 long optimized stress"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2634_a810_gmem_runtime_stress.cpp -o /tmp/mesa-2634-gmem-stress-o3
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-stress-o3 11400714819323198485 1000000

          echo "26.3.5 shader/pipeline probe policy"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2635_shader_pipeline.cpp -o /tmp/mesa-2635-shader-pipeline
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2635-shader-pipeline
      - name: Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Fetch pinned Mesa main snapshot
        run: |
          set -eu
          SOURCE_EECA=eeca16aa41e89a114e53e76439df623c7efb9519
          git clone --depth 1 --filter=blob:none https://github.com/chaotic-cx/mesa-mirror.git mesa
          git -C mesa fetch --depth 1 origin "$SOURCE_EECA"
          git -C mesa checkout --detach "$SOURCE_EECA"
          test "$(git -C mesa rev-parse HEAD)" = "$SOURCE_EECA"
          git -C mesa rev-parse HEAD | tee mesa-commit.txt
          test "$(cat mesa/VERSION)" = "26.3.0-devel"
          git rev-parse HEAD | tee frane-commit.txt
          cat mesa/VERSION
      - name: Apply V28 CLEAN baseline + V29 FAST NOAI changes
        run: |
          set -eu
          python3 patches/port_mesa_2623.py a810
          cp mesa/src/freedreno/vulkan/tu_autotune.cc /tmp/v18-autotune.cc
          python3 patches/v22_a810_lean_profiled.py
          python3 patches/v23_a810_wsi.py
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v23-ir3-compiler.c
          cp mesa/src/freedreno/vulkan/tu_wsi.cc /tmp/v23-tu-wsi.cc
          python3 patches/v24_a810_lean_hotpath.py
          cp mesa/src/freedreno/vulkan/tu_autotune.cc /tmp/v24-tu-autotune.cc
          python3 patches/v25_a810_power_perf.py
          python3 patches/v26_a810_adaptive_cache.py
          python3 patches/v28_universal_adaptive_main.py
          python3 patches/v28_clean_runtime_wsi.py
          python3 patches/v29_fast_noai.py
          python3 patches/mesa_2631_exp_cleanup.py
          python3 patches/mesa_2632_a810_turbo.py
          python3 patches/mesa_2633_a810_profile_turbo.py
          python3 patches/mesa_2634_a810_gmem_runtime.py
          python3 patches/mesa_2635_shader_pipeline.py
          cmp -s /tmp/v23-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v23-tu-wsi.cc mesa/src/freedreno/vulkan/tu_wsi.cc
          echo 'DiskDVD IR3 unchanged; V23 WSI intentionally removed by V28-CLEAN'
          git -C mesa add -N src/freedreno/vulkan/frane_profiled_sampling.h src/freedreno/vulkan/frane_present_policy.h src/freedreno/vulkan/frane_v24_fastpath.h src/freedreno/vulkan/frane_v25_power.h src/freedreno/vulkan/frane_v29_fast.h src/freedreno/vulkan/frane_mesa_2631_sync.h src/freedreno/vulkan/frane_mesa_2632_a810_turbo.h src/freedreno/vulkan/frane_mesa_2633_a810_profile_turbo.h src/freedreno/vulkan/frane_mesa_2634_a810_gmem_runtime.h src/freedreno/vulkan/frane_mesa_2635_shader_pipeline.h
          git -C mesa diff --check
          test "$(cat mesa/VERSION)" = "26.3.0-devel"
          git -C mesa diff > mesa-applied.patch
          test -s mesa-applied.patch
          grep -q 'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP' mesa/src/freedreno/vulkan/tu_device.cc
          ! grep -q 'TU_FRANE_PRESENT_MODE' mesa/src/freedreno/vulkan/tu_wsi.cc
          grep -q 'V28-CLEAN: no driver present-mode override' mesa/src/freedreno/vulkan/tu_wsi.cc
          grep -q 'frane-universal-v29-fast:' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'TU_FRANE_UNIVERSAL_PROFILED' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'img_id' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'TU_IMAGE_ID_ASSIGN' mesa/src/freedreno/vulkan/tu_image.cc
          grep -q 'TU_A810_PWR_MAX' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q 'KGSL_CONSTRAINT_PWR_MAX' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q 'TU_A810_V24_FASTPATH' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'frane_v24_is_definite' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'frane_a830_gmem_pressure_tier' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q IR3_DBG_NODESCPREFETCH mesa/src/freedreno/ir3/ir3_compiler.c
          grep -q 'TU_A810_SAMPLED_DEPTH_DIAG' mesa/src/freedreno/vulkan/tu_image.cc
          grep -q 'kgsl_syncobj_ts_to_fd(&ret)' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          python3 - <<'PYCODE'
          from pathlib import Path
          a=Path('/tmp/v18-autotune.cc').read_text()
          b=Path('mesa/src/freedreno/vulkan/tu_autotune.cc').read_text()
          def updater(s):
              start=s.index('      void update(rp_history &history, bool immediate)')
              end=s.index('    public:', start)
              return s[start:end]
          assert 'frane_cache_warmed' in updater(b) and 'MIN_LOCK_DURATION_COUNT = 15' in updater(b)
          v24=Path('/tmp/v24-tu-autotune.cc').read_text()
          assert 'debug_get_num_option("TU_A810_PROFILED_SAMPLE_INTERVAL", 4)' in v24
          assert 'TU_FRANE_PROFILED_SAMPLE_INTERVAL' in b
          assert 'frane-universal-v29-fast:' in b
          assert '.img_id = cmd->state.attachments[i]->image->id' in b
          assert 'TU_FRANE_UNIVERSAL_PROFILED' in b
          assert 'ts_binning_start' in b and 'ts_binning_end' in b, 'Mesa-main native binning timing missing'
          runtime_marker=b.index('const frane_2634_gmem_layout_input *gmem_runtime_input')
          prof_start=b.rfind('      render_mode get_optimal_mode(', 0, runtime_marker)
          prof_end=b.index('   /** Preemption Latency Optimization Mode **/', runtime_marker)
          prof_decision=b[prof_start:prof_end]
          assert 'history.sysmem_rp_average' not in prof_decision
          assert 'history.gmem_rp_average' not in prof_decision
          assert 'history.frane_gmem_runtime_word.load' in prof_decision
          assert 'rand_xorshift128plus(seed)' not in b
          assert 'frane_v29_neural' not in b
          assert 'frane_model' not in b
          kg=Path('mesa/src/freedreno/vulkan/tu_knl_kgsl.cc').read_text()
          q=Path('mesa/src/freedreno/vulkan/tu_queue.cc').read_text()
          assert 'for (uint32_t i = 0; sync = syncobjs[i], i < count; i++)' not in kg
          assert 'lowest_timestamp = min_ts(lowest_timestamp, sync->timestamp);' in kg
          assert 'FRANE_2631_POLL_READY' in kg
          assert 'frane_2631_deadline_ns' in kg
          assert 'pthread_mutex_unlock(&device->submit_mutex);\n      return VK_ERROR_OUT_OF_HOST_MEMORY;' in q
          assert 'frane_2632_profile_base_interval' in b
          assert 'if (num_fds && queue != NULL)' in kg
          assert 'Frane Mesa 26.3.4 A810 GMEM-RUNTIME EXP' in Path('mesa/src/freedreno/vulkan/tu_device.cc').read_text()
          assert 'frane_2633_decision_draw(history.hash)' in b
          assert 'decision_ticket.fetch_add' not in b
          assert 'frane_2633_profile_interval' in b
          assert 'frane_2633_maintenance_due' in b
          pwr=Path('mesa/src/freedreno/vulkan/frane_v25_power.h').read_text()
          assert 'frane_2633_power_refresh_due' in pwr
          assert 'STACK_POLL_FDS = 16' in kg
          assert 'u_vector_add(&poll_fds)' not in kg[kg.index('kgsl_syncobj_wait_any'):kg.index('kgsl_syncobj_export')]
          assert 'malloc((size_t(count) + 1u) * sizeof(*fds))' in kg
          assert 'TU_A810_GMEM_RUNTIME' in b
          assert 'frane_2634_update_gmem_state' in b
          assert 'frane_2634_decide_gmem_runtime' in b
          assert 'frane_gmem_runtime_word' in b
          assert 'TU_GMEM_LAYOUT_FULL' in b
          assert 'return a830;' in b, 'old A810 custom BANDWIDTH runtime accidentally restored'
          assert 'algo_strv = "profiled";' in b
          assert 'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP' in Path('mesa/src/freedreno/vulkan/tu_device.cc').read_text()
          pipeline=Path('mesa/src/freedreno/vulkan/tu_pipeline.cc').read_text()
          shader=Path('mesa/src/freedreno/vulkan/tu_shader.cc').read_text()
          device_h=Path('mesa/src/freedreno/vulkan/tu_device.h').read_text()
          assert 'frane_2635_record_stage_probe' in pipeline
          assert 'break;' not in pipeline[pipeline.index('frane_2635_stage_probe_state'):pipeline.index('cache_hit = frane_probe.all_hit')]
          assert 'frane_shader_cache_hit_mask' in pipeline
          assert 'frane_2635_stage_was_cached' in pipeline
          assert 'vk_pipeline_cache_lookup_nir' in shader
          assert 'vk_pipeline_cache_add_nir' in shader
          assert 'FRANE_2635_STAGE_NIR_MAX_ENTRIES' in shader
          assert 'vk_pipeline_cache_object_unref(&device->vk' in shader
          assert 'frane_stage_nir_cache' in device_h
          assert 'skip_disk_cache = true' in Path('mesa/src/freedreno/vulkan/tu_device.cc').read_text()
          assert 'creation_feedback ? stage_feedbacks : NULL' in pipeline
          assert 'stage_feedbacks ? os_time_get_nano() : 0' in shader
          assert 'TU_A810_GMEM_RUNTIME' in b and 'frane_2634_decide_gmem_runtime' in b
          print('Mesa 26.3.5 A810 SHADER-PIPELINE + 26.3.4 GMEM runtime + inherited sync fixes verified')
          PYCODE
          python3 -m py_compile patches/port_upstream_main.py patches/port_mesa_2623.py patches/v22_a810_lean_profiled.py patches/v23_a810_wsi.py patches/v24_a810_lean_hotpath.py patches/v25_a810_power_perf.py patches/v26_a810_adaptive_cache.py patches/v28_universal_adaptive_main.py patches/v28_clean_runtime_wsi.py patches/v29_fast_noai.py patches/mesa_2631_exp_cleanup.py patches/mesa_2632_a810_turbo.py patches/mesa_2633_a810_profile_turbo.py patches/mesa_2634_a810_gmem_runtime.py patches/mesa_2635_shader_pipeline.py
      - name: Prepare Android ARM64 cross file
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.ini <<EOF
          [binaries]
          ar = '$BIN/llvm-ar'
          c = '$BIN/aarch64-linux-android34-clang'
          cpp = ['$BIN/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']
          [built-in options]
          cpp_link_args = ['-static-libstdc++']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
      - name: Configure pinned Mesa main Android Turnip
        run: |
          meson setup mesa/build-android mesa --cross-file android-aarch64.ini -Dbuildtype=release -Dcpp_args=-Wno-c++11-narrowing -Dplatforms=android -Dplatform-sdk-version=36 -Dandroid-stub=true -Dandroid-libbacktrace=disabled -Degl=disabled -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl -Dvulkan-beta=true
      - name: Compile real Android ARM64 Vulkan driver
        run: meson compile -C mesa/build-android -j 4
      - name: Package Winlator AdrenoTools Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip and provenance
        run: |
          set -eu
          mkdir -p output
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/
          python3 - <<'PY'
          import json, pathlib
          version=pathlib.Path('mesa/VERSION').read_text().strip()
          data = {
            'schemaVersion': 1, 'name': 'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP',
            'driverVersion': f'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP (base {version})', 'description': 'A810 experiment: bounded RAM-only intermediate NIR cache, full partial-stage cache probing and reduced pipeline creation timing overhead',
            'author': 'Frane12; Mesa/Freedreno contributors', 'packageVersion': '26.3.5-a810-shader-pipeline-exp-eeca16aa',
            'vendor': 'Mesa', 'minApi': 34, 'libraryName': 'libvulkan_freedreno.so',
            'sourceCommit': pathlib.Path('frane-commit.txt').read_text().strip()
          }
          pathlib.Path('output/meta.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          (cd output && zip -9 ../Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip libvulkan_freedreno.so meta.json)
          sha256sum output/libvulkan_freedreno.so > driver-sha256.txt
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip') as z:
              assert set(z.namelist()) == {'libvulkan_freedreno.so','meta.json'}
              assert z.testzip() is None
              assert z.read('libvulkan_freedreno.so')[:4] == b'\x7fELF'
              so = z.read('libvulkan_freedreno.so')
              assert len(so)>1000000
              assert so[4:6] == bytes([2, 1]), 'Expected ELF64 little-endian'
              assert int.from_bytes(so[16:18], 'little') == 3, 'Expected shared library'
              assert int.from_bytes(so[18:20], 'little') == 183, 'Expected AArch64'
              assert json.loads(z.read('meta.json'))['schemaVersion']==1
          print('Driver Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip verified')
          PY
      - name: Record package checksums
        run: |
          sha256sum Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip mesa-applied.patch > SHA256SUMS.txt
      - name: Upload compiled Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip and full source diff
        uses: actions/upload-artifact@v4
        with:
          name: Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP
          path: |
            Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip
            mesa-commit.txt
            frane-commit.txt
            mesa-applied.patch
            driver-sha256.txt
            SHA256SUMS.txt
            EXPERIMENT_MESA_26_3_5_A810_SHADER_PIPELINE.md
      - name: Publish experimental driver with source and checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/frane-mesa-26.3.5-a810-shader-pipeline-exp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view frane-mesa-26.3.5-a810-shader-pipeline-exp >/dev/null 2>&1; then
            gh release upload frane-mesa-26.3.5-a810-shader-pipeline-exp \
              Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip \
              mesa-applied.patch SHA256SUMS.txt mesa-commit.txt frane-commit.txt driver-sha256.txt \
              --clobber
            gh release edit frane-mesa-26.3.5-a810-shader-pipeline-exp --target "$GITHUB_SHA" \
              --title 'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP (experimental)' \
              --notes-file EXPERIMENT_MESA_26_3_5_A810_SHADER_PIPELINE.md
          else
            gh release create frane-mesa-26.3.5-a810-shader-pipeline-exp \
              Frane-Mesa-26.3.5-A810-SHADER-PIPELINE-EXP.zip \
              mesa-applied.patch SHA256SUMS.txt mesa-commit.txt frane-commit.txt driver-sha256.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Frane Mesa 26.3.5 A810 SHADER-PIPELINE EXP (experimental)' \
              --notes-file EXPERIMENT_MESA_26_3_5_A810_SHADER_PIPELINE.md
          fi
