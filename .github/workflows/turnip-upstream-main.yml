name: Drnas Turnip A830 PF-AUDIT V1.0

on:
  push:
    branches: ['drnas-a830-pf-audit-v1.0']
    paths:
      - '.github/workflows/turnip-upstream-main.yml'
      - 'patches/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drnas-a830-pf-audit-v1.0
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Frane patch stack
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build pkg-config python3-pip python3-mako python3-yaml python3-ply python3-packaging bison flex glslang-tools spirv-tools libdrm-dev libelf-dev libexpat1-dev libzstd-dev zip
          python3 -m pip install --break-system-packages 'meson>=1.4' mako pyyaml packaging ply
      - name: Validate experimental timing policy on host
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/profiled_sampling.cpp -o /tmp/profiled-policy-test
          /tmp/profiled-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/present_policy.cpp -o /tmp/present-policy-test
          /tmp/present-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v24_hotpath_equivalence.cpp -o /tmp/v24-hotpath-test
          /tmp/v24-hotpath-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v25_power_policy.cpp -o /tmp/v25-power-test
          /tmp/v25-power-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/v29_fast_policy.cpp -o /tmp/v29-fast-policy-test
          /tmp/v29-fast-policy-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2631_sync_policy.cpp -o /tmp/mesa-2631-sync-test
          /tmp/mesa-2631-sync-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2632_a810_turbo.cpp -o /tmp/mesa-2632-turbo-test
          /tmp/mesa-2632-turbo-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2633_a810_profile_turbo.cpp -o /tmp/mesa-2633-profile-turbo-test
          /tmp/mesa-2633-profile-turbo-test

          echo "26.3.4 deterministic ASan+UBSan"
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2634_a810_gmem_runtime.cpp -o /tmp/mesa-2634-gmem-test-asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-test-asan

          echo "26.3.4 deterministic O3+UBSan"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2634_a810_gmem_runtime.cpp -o /tmp/mesa-2634-gmem-test-o3
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-test-o3

          echo "26.3.4 randomized stress ASan+UBSan"
          g++ -std=c++17 -O2 -g -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2634_a810_gmem_runtime_stress.cpp -o /tmp/mesa-2634-gmem-stress
          for seed in 1 17 65537 3735928559 305419896; do
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-stress "$seed" 250000
          done

          echo "26.3.4 long optimized stress"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2634_a810_gmem_runtime_stress.cpp -o /tmp/mesa-2634-gmem-stress-o3
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2634-gmem-stress-o3 11400714819323198485 1000000

          echo "26.3.5 shader/pipeline probe policy"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined tests/mesa_2635_shader_pipeline.cpp -o /tmp/mesa-2635-shader-pipeline
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2635-shader-pipeline

          echo "26.3.7 hot-RP publication/collision model"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined -pthread tests/mesa_2637_hot_cache.cpp -o /tmp/mesa-2637-hot-cache
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2637-hot-cache

          echo "26.3.8 borrowed pinned hot-handle model"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined -pthread tests/mesa_2638_borrowed_hot_handle.cpp -o /tmp/mesa-2638-borrowed-hot-handle
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2638-borrowed-hot-handle

          echo "26.3.9 Gen8 GMEM inactive-dimension model"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_2639_gmem_dimensions.cpp -o /tmp/mesa-2639-gmem-dim
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-2639-gmem-dim

          echo "26.3.10 A810 UBO locality budget model"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26310_ubo_locality.cpp -o /tmp/mesa-26310-ubo-locality
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26310-ubo-locality

          echo "26.3.11 A810 safe texture prefetch model"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26311_safe_tex_prefetch.cpp -o /tmp/mesa-26311-safe-tex-prefetch
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26311-safe-tex-prefetch

          echo "26.3.12 A810 dual texture prefetch model"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26312_dual_tex_prefetch.cpp -o /tmp/mesa-26312-dual-tex-prefetch
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26312-dual-tex-prefetch

          echo "26.3.13 A810 LRZ fastpath policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26313_lrz_fastpath.cpp -o /tmp/mesa-26313-lrz-fastpath
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26313-lrz-fastpath

          echo "26.3.14 A810 LRZ-safe + triple-prefetch policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26314_lrz_safe_triple_prefetch.cpp -o /tmp/mesa-26314-lrz-safe-triple-prefetch
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26314-lrz-safe-triple-prefetch

          echo "26.3.15 A810 prefetch-selection policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26315_prefetch_select.cpp -o /tmp/mesa-26315-prefetch-select
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26315-prefetch-select

          echo "26.3.16 A810 prefetch-use scoring policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26316_prefetch_score.cpp -o /tmp/mesa-26316-prefetch-score
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26316-prefetch-score

          echo "26.3.17 A810 adaptive IR3 scheduler policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26317_adaptive_ir3_sched.cpp -o /tmp/mesa-26317-adaptive-ir3-sched
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26317-adaptive-ir3-sched

          echo "26.3.18 A810 SMART-GMEM policy"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -fsanitize=undefined tests/mesa_26318_smart_gmem.cpp -o /tmp/mesa-26318-smart-gmem
          UBSAN_OPTIONS=halt_on_error=1 /tmp/mesa-26318-smart-gmem
      - name: Android NDK r29
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Fetch pinned Mesa main snapshot
        run: |
          set -eu
          SOURCE_EECA=eeca16aa41e89a114e53e76439df623c7efb9519
          git clone --depth 1 --filter=blob:none https://github.com/chaotic-cx/mesa-mirror.git mesa
          git -C mesa fetch --depth 1 origin "$SOURCE_EECA"
          git -C mesa checkout --detach "$SOURCE_EECA"
          test "$(git -C mesa rev-parse HEAD)" = "$SOURCE_EECA"
          git -C mesa rev-parse HEAD | tee mesa-commit.txt
          test "$(cat mesa/VERSION)" = "26.3.0-devel"
          git rev-parse HEAD | tee frane-commit.txt
          cat mesa/VERSION
      - name: Apply V28 CLEAN baseline + V29 FAST NOAI changes
        run: |
          set -eu
          python3 patches/port_mesa_2623.py a810
          cp mesa/src/freedreno/vulkan/tu_autotune.cc /tmp/v18-autotune.cc
          python3 patches/v22_a810_lean_profiled.py
          python3 patches/v23_a810_wsi.py
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v23-ir3-compiler.c
          cp mesa/src/freedreno/vulkan/tu_wsi.cc /tmp/v23-tu-wsi.cc
          python3 patches/v24_a810_lean_hotpath.py
          cp mesa/src/freedreno/vulkan/tu_autotune.cc /tmp/v24-tu-autotune.cc
          python3 patches/v25_a810_power_perf.py
          python3 patches/v26_a810_adaptive_cache.py
          python3 patches/v28_universal_adaptive_main.py
          python3 patches/v28_clean_runtime_wsi.py
          python3 patches/v29_fast_noai.py
          python3 patches/mesa_2631_exp_cleanup.py
          python3 patches/mesa_2632_a810_turbo.py
          python3 patches/mesa_2633_a810_profile_turbo.py
          python3 patches/mesa_2634_a810_gmem_runtime.py
          python3 patches/mesa_2635_shader_pipeline.py
          python3 patches/mesa_2636_audit_fixes.py
          python3 tests/mesa_2636_pipeline_cleanup.py
          python3 patches/mesa_2637_a810_core_fastpath.py
          python3 patches/mesa_2638_a810_hotpath_v2.py
          python3 patches/mesa_2639_a810_gmem_dimensions.py
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v239-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v239-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_nir_analyze_ubo_ranges.c /tmp/v239-ir3-ubo.c
          cmp -s /tmp/v23-ir3-compiler.c /tmp/v239-ir3-compiler.c
          python3 patches/mesa_26310_a810_ubo_locality.py
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v2310-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v2310-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_context.c /tmp/v2310-ir3-context.c
          cp mesa/src/freedreno/ir3/ir3_nir.h /tmp/v2310-ir3-nir.h
          cp mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c /tmp/v2310-ir3-tex-prefetch.c
          python3 patches/mesa_26311_a810_safe_tex_prefetch.py
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v2311-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v2311-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_context.c /tmp/v2311-ir3-context.c
          python3 patches/mesa_26312_a810_dual_tex_prefetch.py
          cp mesa/src/freedreno/vulkan/tu_pipeline.cc /tmp/v2312-tu-pipeline.cc
          cp mesa/src/freedreno/vulkan/tu_cmd_buffer.cc /tmp/v2312-tu-cmd-buffer.cc
          python3 patches/mesa_26313_a810_lrz_fastpath.py
          ! cmp -s /tmp/v2312-tu-pipeline.cc mesa/src/freedreno/vulkan/tu_pipeline.cc
          ! cmp -s /tmp/v2312-tu-cmd-buffer.cc mesa/src/freedreno/vulkan/tu_cmd_buffer.cc
          cp mesa/src/freedreno/vulkan/tu_cmd_buffer.cc /tmp/v2313-tu-cmd-buffer.cc
          cp mesa/src/freedreno/ir3/ir3_context.c /tmp/v2313-ir3-context.c
          python3 patches/mesa_26314_a810_lrz_safe_triple_prefetch.py
          ! cmp -s /tmp/v2313-tu-cmd-buffer.cc mesa/src/freedreno/vulkan/tu_cmd_buffer.cc
          ! cmp -s /tmp/v2313-ir3-context.c mesa/src/freedreno/ir3/ir3_context.c
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v2314-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v2314-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_context.c /tmp/v2314-ir3-context.c
          cp mesa/src/freedreno/ir3/ir3_nir.h /tmp/v2314-ir3-nir.h
          cp mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c /tmp/v2314-ir3-tex-prefetch.c
          python3 patches/mesa_26315_a810_prefetch_select.py
          ! cmp -s /tmp/v2314-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v2314-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v2314-ir3-context.c mesa/src/freedreno/ir3/ir3_context.c
          ! cmp -s /tmp/v2314-ir3-nir.h mesa/src/freedreno/ir3/ir3_nir.h
          ! cmp -s /tmp/v2314-ir3-tex-prefetch.c mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v2315-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v2315-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_context.c /tmp/v2315-ir3-context.c
          cp mesa/src/freedreno/ir3/ir3_nir.h /tmp/v2315-ir3-nir.h
          cp mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c /tmp/v2315-ir3-tex-prefetch.c
          python3 patches/mesa_26316_a810_prefetch_score.py
          ! cmp -s /tmp/v2315-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v2315-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v2315-ir3-context.c mesa/src/freedreno/ir3/ir3_context.c
          ! cmp -s /tmp/v2315-ir3-nir.h mesa/src/freedreno/ir3/ir3_nir.h
          ! cmp -s /tmp/v2315-ir3-tex-prefetch.c mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c
          cp mesa/src/freedreno/ir3/ir3_compiler.c /tmp/v2316-ir3-compiler.c
          cp mesa/src/freedreno/ir3/ir3_compiler.h /tmp/v2316-ir3-compiler.h
          cp mesa/src/freedreno/ir3/ir3_sched.c /tmp/v2316-ir3-sched.c
          python3 patches/mesa_26317_a810_adaptive_ir3_sched.py
          ! cmp -s /tmp/v2316-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v2316-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v2316-ir3-sched.c mesa/src/freedreno/ir3/ir3_sched.c
          cp mesa/src/freedreno/vulkan/tu_autotune.cc /tmp/v2317-tu-autotune.cc
          python3 patches/mesa_26318_a810_smart_gmem.py
          ! cmp -s /tmp/v2317-tu-autotune.cc mesa/src/freedreno/vulkan/tu_autotune.cc
          ! cmp -s /tmp/v2311-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v2311-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v2311-ir3-context.c mesa/src/freedreno/ir3/ir3_context.c
          ! cmp -s /tmp/v2310-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v2310-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v2310-ir3-context.c mesa/src/freedreno/ir3/ir3_context.c
          ! cmp -s /tmp/v2310-ir3-nir.h mesa/src/freedreno/ir3/ir3_nir.h
          ! cmp -s /tmp/v2310-ir3-tex-prefetch.c mesa/src/freedreno/ir3/ir3_nir_lower_tex_prefetch.c
          ! cmp -s /tmp/v239-ir3-compiler.c mesa/src/freedreno/ir3/ir3_compiler.c
          ! cmp -s /tmp/v239-ir3-compiler.h mesa/src/freedreno/ir3/ir3_compiler.h
          ! cmp -s /tmp/v239-ir3-ubo.c mesa/src/freedreno/ir3/ir3_nir_analyze_ubo_ranges.c
          ! cmp -s /tmp/v23-tu-wsi.cc mesa/src/freedreno/vulkan/tu_wsi.cc
          echo '26.3.10 intentionally changes only IR3 UBO locality plus identity; V23 WSI remains removed by V28-CLEAN'
          git -C mesa add -N src/freedreno/vulkan/frane_profiled_sampling.h src/freedreno/vulkan/frane_present_policy.h src/freedreno/vulkan/frane_v24_fastpath.h src/freedreno/vulkan/frane_v25_power.h src/freedreno/vulkan/frane_v29_fast.h src/freedreno/vulkan/frane_mesa_2631_sync.h src/freedreno/vulkan/frane_mesa_2632_a810_turbo.h src/freedreno/vulkan/frane_mesa_2633_a810_profile_turbo.h src/freedreno/vulkan/frane_mesa_2634_a810_gmem_runtime.h src/freedreno/vulkan/frane_mesa_2635_shader_pipeline.h src/freedreno/vulkan/frane_mesa_26318_a810_smart_gmem.h
          git -C mesa diff --check
          test "$(cat mesa/VERSION)" = "26.3.0-devel"
          git -C mesa diff > mesa-applied.patch
          test -s mesa-applied.patch
          grep -q 'Frane Mesa 26.3.18 A810 SMART-GMEM EXP' mesa/src/freedreno/vulkan/tu_device.cc
          ! grep -q 'TU_FRANE_PRESENT_MODE' mesa/src/freedreno/vulkan/tu_wsi.cc
          grep -q 'V28-CLEAN: no driver present-mode override' mesa/src/freedreno/vulkan/tu_wsi.cc
          grep -q 'frane-universal-v29-fast:' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'TU_FRANE_UNIVERSAL_PROFILED' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'img_id' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'TU_IMAGE_ID_ASSIGN' mesa/src/freedreno/vulkan/tu_image.cc
          grep -q 'TU_A810_PWR_MAX' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q 'KGSL_CONSTRAINT_PWR_MAX' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -q 'TU_A810_V24_FASTPATH' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'frane_v24_is_definite' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q 'frane_a830_gmem_pressure_tier' mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -q IR3_DBG_NODESCPREFETCH mesa/src/freedreno/ir3/ir3_compiler.c
          grep -q 'TU_A810_SAMPLED_DEPTH_DIAG' mesa/src/freedreno/vulkan/tu_image.cc
          grep -q 'kgsl_syncobj_ts_to_fd(&ret)' mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          python3 - <<'PYCODE'
          from pathlib import Path
          a=Path('/tmp/v18-autotune.cc').read_text()
          b=Path('mesa/src/freedreno/vulkan/tu_autotune.cc').read_text()
          def updater(s):
              start=s.index('      void update(rp_history &history, bool immediate)')
              end=s.index('    public:', start)
              return s[start:end]
          assert 'frane_cache_warmed' in updater(b) and 'MIN_LOCK_DURATION_COUNT = 15' in updater(b)
          v24=Path('/tmp/v24-tu-autotune.cc').read_text()
          assert 'debug_get_num_option("TU_A810_PROFILED_SAMPLE_INTERVAL", 4)' in v24
          assert 'TU_FRANE_PROFILED_SAMPLE_INTERVAL' in b
          assert 'frane-universal-v29-fast:' in b
          assert '.img_id = cmd->state.attachments[i]->image->id' in b
          assert 'TU_FRANE_UNIVERSAL_PROFILED' in b
          assert 'ts_binning_start' in b and 'ts_binning_end' in b, 'Mesa-main native binning timing missing'
          runtime_marker=b.index('const frane_26318_smart_gmem_input *gmem_runtime_input')
          prof_start=b.rfind('      render_mode get_optimal_mode(', 0, runtime_marker)
          prof_end=b.index('   /** Preemption Latency Optimization Mode **/', runtime_marker)
          prof_decision=b[prof_start:prof_end]
          assert 'history.sysmem_rp_average' not in prof_decision
          assert 'history.gmem_rp_average' not in prof_decision
          assert 'history.frane_gmem_runtime_word.load' in prof_decision
          assert 'rand_xorshift128plus(seed)' not in b
          assert 'frane_v29_neural' not in b
          assert 'frane_model' not in b
          kg=Path('mesa/src/freedreno/vulkan/tu_knl_kgsl.cc').read_text()
          q=Path('mesa/src/freedreno/vulkan/tu_queue.cc').read_text()
          assert 'for (uint32_t i = 0; sync = syncobjs[i], i < count; i++)' not in kg
          assert 'lowest_timestamp = min_ts(lowest_timestamp, sync->timestamp);' in kg
          assert 'FRANE_2631_POLL_READY' in kg
          assert 'frane_2631_deadline_ns' in kg
          assert 'pthread_mutex_unlock(&device->submit_mutex);\n      return VK_ERROR_OUT_OF_HOST_MEMORY;' in q
          assert 'frane_2632_profile_base_interval' in b
          assert 'if (num_fds && queue != NULL)' in kg
          assert 'frane_2633_decision_draw(history.hash)' in b
          assert 'decision_ticket.fetch_add' not in b
          assert 'frane_2633_profile_interval' in b
